# CLIPFORGE settings. Everything tunable lives here. Secrets live in .env.

app:
  name: CLIPFORGE
  # Bind address for the web app
  host: 0.0.0.0
  port: 8000
  # How many render jobs run at the same time. 1 is right for a small CPU box.
  workers: 1
  # Source videos older than this are deleted automatically (clips are kept).
  delete_sources_after_days: 7
  # Set true when the app is served over https (cookie gets the Secure flag)
  https: false

download:
  max_height: 1080
  # Solver components yt-dlp may fetch when the bundled ones are too old. Empty list = never fetch.
  remote_components: [ejs:github, ejs:npm]
  # With YTDLP_PROXY set: send only YouTube's small API calls through the proxy and pull the video itself
  # straight from Google's servers. Keeps a paid residential proxy to a few pennies an episode.
  proxy_metadata_only: true
  retries: 3
  # Seconds a download may take before it is treated as blocked
  timeout: 1800

transcribe:
  # auto | whisper | parakeet
  # auto = whisper large-v3 on a GPU, Parakeet (fast, accurate, no Hugging Face needed) on a CPU
  backend: auto
  whisper_model_gpu: large-v3
  whisper_model_cpu: small
  language: en
  # Parakeet (NVIDIA, via sherpa-onnx). Downloaded from GitHub the first time.
  parakeet_model: sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
  parakeet_url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
  chunk_seconds: 30

review:
  # Read every finished clip back before it is allowed to post by itself
  enabled: true
  # Look at the rendered frames for faces (slower, but catches cut-off heads)
  check_faces: true
  # A face must be visible in at least this share of the clip
  min_face_share: 0.45
  # A head whose box starts this close to the top of the frame is being cut off
  headroom_fraction: 0.02
  # A face shorter than this share of the frame height is too small to hold attention
  min_face_height_fraction: 0.07

llm:
  # Model used to pick moments, titles, hooks, zooms and B-roll ideas
  pick_model: claude-sonnet-5
  # Model used for the fact check
  check_model: claude-haiku-4-5
  # Transcript text sent per request (seconds of video)
  chunk_seconds: 1200
  # Candidates asked for per chunk
  candidates_per_chunk: 8
  max_tokens: 8000

moments:
  default_clips: 5
  # Length presets in seconds: auto picks whatever reads best inside min..max
  # auto's floor was 15s and the picker took it. 15s is long enough to hold a setup and almost
  # never long enough to hold the payoff as well, so clips ended mid-thought. 25s is about the
  # shortest a complete point survives in. Use the `short` preset if you really do want 10-30s.
  lengths:
    auto:   {min: 25, max: 90}
    short:  {min: 10, max: 30}
    medium: {min: 30, max: 60}
    long:   {min: 60, max: 90}
  # How far a clip may run OVER max when that is what it takes to land the payoff on a sentence
  # end. Running long is recoverable; cutting the point off is not.
  overflow_grace: 8.0
  # Two clips whose spoken words overlap more than this are the same clip twice (0-1)
  max_similarity: 0.45
  # How many clips may share one topic before variety wins
  max_per_topic: 1
  # Padding added around the snapped words
  pad_before: 0.15
  pad_after: 0.35
  default_keywords: [God, Jesus, Bible, prophecy, faith, heaven, theory, history, aliens, ancient]

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast
  audio_bitrate: 160k
  # Target loudness (LUFS) and true peak (dBTP)
  loudness: -14
  true_peak: -1.5
  ratios:
    "9:16": [1080, 1920]
    "1:1":  [1080, 1080]
    "16:9": [1920, 1080]

captions:
  default_preset: viral
  # Preset used automatically when the fact check says the clip is faith content
  faith_preset: faith
  words_per_line_max: 4
  words_per_line_min: 2
  # Max caption width as a share of the frame width (keeps clear of the Shorts buttons on the right)
  max_width_frac: 0.82
  # Vertical centre of the caption line as a share of frame height (0.66 = lower-middle third, above the Shorts UI)
  y_frac: {"9:16": 0.66, "1:1": 0.80, "16:9": 0.82}
  # A new line starts after a pause longer than this (seconds)
  gap_split: 0.6
  hold_after: 0.25
  emoji: true
  emoji_every_seconds: 5
  emoji_font: /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
  presets:
    viral:
      label: Viral
      font: Montserrat Black
      size: 104
      uppercase: true
      color: "#FFFFFF"
      highlight: "#2BFF4A"
      keyword: "#FFD400"
      outline: 8
      outline_color: "#000000"
      shadow: 3
      shadow_color: "#000000"
      pop: 112
      y_frac: 0.60
      words_per_line_max: 3
    bold_pop:
      label: Bold pop
      font: Montserrat ExtraBold
      size: 76
      uppercase: true
      color: "#FFFFFF"
      highlight: "#FFD400"
      keyword: "#FF6B3D"
      outline: 7
      outline_color: "#000000"
      shadow: 0
      pop: 112
    clean:
      label: Clean
      font: Poppins SemiBold
      size: 68
      uppercase: false
      color: "#FFFFFF"
      highlight: "#FFFFFF"
      keyword: "#F5A524"
      outline: 0
      outline_color: "#000000"
      shadow: 4
      shadow_color: "#000000"
      pop: 106
      highlight_alpha_dim: true
    faith:
      label: Faith
      font: Poppins Bold
      size: 70
      uppercase: false
      color: "#FFF8E7"
      highlight: "#F2C14E"
      keyword: "#F2C14E"
      outline: 4
      outline_color: "#2B1D0E"
      shadow: 2
      shadow_color: "#000000"
      pop: 108
    neon:
      label: Neon
      font: Bebas Neue
      size: 96
      uppercase: true
      color: "#FFFFFF"
      highlight: "#39FF14"
      keyword: "#FF3CAC"
      outline: 3
      outline_color: "#0B3D0B"
      shadow: 0
      glow: true
      pop: 110
    boxed:
      label: Boxed
      font: Anton
      size: 78
      uppercase: true
      color: "#FFFFFF"
      highlight: "#111111"
      keyword: "#FFFFFF"
      box_color: "#F5A524"
      keyword_box_color: "#E63946"
      outline: 5
      outline_color: "#000000"
      shadow: 0
      pop: 104
    minimal:
      label: Minimal
      font: Montserrat SemiBold
      size: 56
      uppercase: false
      color: "#FFFFFF"
      highlight: "#FFFFFF"
      keyword: "#FFFFFF"
      outline: 0
      shadow: 0
      backdrop: "#000000AA"
      pop: 100

reframe:
  # Frames per second used to look for faces
  sample_fps: 5
  # Width the video is shrunk to while looking for faces (speed)
  detect_width: 960
  # Faces smaller than this share of the frame height are ignored (people in the background)
  min_face_frac: 0.06
  # A face must appear in this share of a shot's frames to count
  min_coverage: 0.4
  # if nobody is detected for this long inside a shot, that part becomes a 'whole picture' shot
  lost_face_seconds: 2.0
  # PySceneDetect content threshold: lower = more cuts found
  scene_threshold: 27
  min_shot_seconds: 0.6
  # Where the face centre sits in a single crop (0 = top, 1 = bottom)
  face_y_frac: 0.40
  # Tight framing: the crop is sized so the face is about this share of the crop height
  face_height_frac: 0.20
  # ...but never crop below this share of the source height (keeps it sharp)
  min_crop_frac: 0.62
  # Same for each half of a split crop: the top face sits lower so the hook card never covers it
  split_face_y_frac: 0.42
  split_top_face_y_frac: 0.72
  # the top half is cropped tighter (share of the source height) so the face can sit below the hook card
  split_top_crop_frac: 0.5
  # How much of the crop width the face may drift before the camera follows (steady camera feel)
  dead_zone_frac: 0.10
  # Seconds for the smooth follow to settle
  ease_seconds: 0.6
  # Seconds for the quick ease after a speaker switch
  switch_ease_seconds: 0.35
  # Speaker switches happen at most this often (seconds)
  min_switch_seconds: 2.0
  # Wide layout background: blur radius and darkness
  bg_blur: 31
  bg_dark: 0.45
  divider_px: 6
  divider_color: "#0f1115"
  # What to do on shots with 3+ faces when layout is auto: wide | speaker
  three_plus: speaker

hook:
  enabled: true
  # seconds the hook stays at the start; 0 = the whole clip
  seconds: 3.5
  font: Montserrat ExtraBold
  size: 100
  text_color: "#111111"
  box_color: "#FFFFFF"
  # top of the hook box as a share of the frame height
  y_frac: 0.10
  max_words: 10
  max_lines: 4
  # smaller card on two-person (split) clips so it stays clear of the top face
  size_split: 80
  # card | box | bar | plain   (card = big white rounded card like the popular podcast clips)
  style: card

zooms:
  enabled: true
  max_per_clip: 3
  amount: 1.12
  ease_in: 0.35
  hold: 1.1
  ease_out: 0.5
  # no zoom this close to a camera cut (seconds)
  cut_margin: 0.3

filler:
  # off | light | aggressive
  level: light
  fillers: [um, uh, uhm, umm, uhh, hmm, mm, er, erm, ah]
  aggressive_fillers: [like, "you know", "i mean", "sort of", "kind of", basically, literally, actually]
  # gaps between words longer than this are shortened
  silence_gap: 0.6
  keep_pause: {light: 0.3, aggressive: 0.18}
  # keep this much air around every cut so no word is clipped
  margin: 0.05

progress_bar:
  enabled: true
  height: 8
  color: "#F5A524"

cards:
  intro_seconds: 0.8
  outro_seconds: 1.6

broll:
  enabled: true
  max_per_clip: 2
  min_seconds: 1.5
  max_seconds: 2.5
  # at least this far apart (seconds) and never in the first seconds of a clip
  min_gap: 6.0
  not_before: 3.0
  # Pexels search: orientation portrait for 9:16
  per_page: 5
