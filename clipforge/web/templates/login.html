{% extends "base.html" %}
{% block title %}Log in · CLIPFORGE{% endblock %}
{% block content %}
<div class="card login">
  <h1>Welcome back</h1>
  <p class="muted">Enter your password to open CLIPFORGE.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input class="input big" type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button class="btn primary big" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
